name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "0.0.1"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (debug-signed for install)
        run: ./gradlew assembleRelease -PsignWithDebug=true

      - name: Create GitHub Release (tag 0.0.1)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "0.0.1"
          name: "Motion Capture v0.0.1"
          body: |
            ## Motion Capture v0.0.1

            Initial release.

            - Live camera preview (CameraX) with ML Kit object detection
            - Auto-saves photos to the gallery when motion is detected
            - Live HUD (today count, detecting elapsed time, last capture)
            - Confidence chip, detection bounding box, focus grid, saved toast
            - Manual pause / resume, flash toggle, front & back camera flip
            - Gallery grid with full-screen photo viewer
            - Settings: detection sensitivity, detect-only-people, capture burst, save destination, notifications
          files: |
            app/build/outputs/apk/release/app-release.apk
